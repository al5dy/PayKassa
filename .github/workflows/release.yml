name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read version
        id: version
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"

          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid tag: $GITHUB_REF_NAME"
            exit 1
          fi

          PLUGIN_VERSION="$(
            grep -m1 '^ \* Version:' paykassa.php |
            sed -E 's/^ \* Version:[[:space:]]*//'
          )"

          STABLE_TAG="$(
            grep -m1 '^Stable tag:' readme.txt |
            sed -E 's/^Stable tag:[[:space:]]*//'
          )"

          if [[ "$VERSION" != "$PLUGIN_VERSION" ]]; then
            echo "Tag version $VERSION != plugin version $PLUGIN_VERSION"
            exit 1
          fi

          if [[ "$VERSION" != "$STABLE_TAG" ]]; then
            echo "Tag version $VERSION != Stable tag $STABLE_TAG"
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build plugin ZIP
        run: bash scripts/package.sh "${{ steps.version.outputs.version }}"

      - name: Verify ZIP
        run: |
          unzip -l "dist/paykassa-${{ steps.version.outputs.version }}.zip"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "dist/paykassa-${{ steps.version.outputs.version }}.zip" \
            --title "PayKassa for WooCommerce ${{ steps.version.outputs.version }}" \
            --generate-notes